name: Refresh Vite lockfile

on:
  push:
    branches:
      - fix/dependabot-minimatch-11
    paths:
      - package.json
      - .github/workflows/refresh-vite-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dependabot-minimatch-11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install regenerated dependency tree
        run: npm ci
      - name: Show Vite toolchain versions
        run: npm ls vite @vitejs/plugin-vue vite-plugin-pwa vitest --depth=0
      - name: Commit regenerated lock and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-vite-lock.yml
          git add package-lock.json
          git commit -m "chore: refresh lockfile for latest Vite toolchain"
          git push origin HEAD:fix/dependabot-minimatch-11
