name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  database-security:
    name: Database security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d attendance_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: attendance_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Supabase REST roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
          end $$;
          SQL

      - name: Apply base schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema_base.sql

      - name: Apply security hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_security_hardening.sql

      - name: Apply audit follow-up migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_security_audit_followup.sql

      - name: Apply admin step-up compatibility migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_security_stepup_compat.sql

      - name: Run unified database security regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security.sql
