name: Refresh PWA security lockfile

on:
  push:
    branches:
      - fix/pwa-build-dependency-security
    paths:
      - .github/workflows/refresh-pwa-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/pwa-build-dependency-security

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install resolved tree
        run: npm ci

      - name: Show security-sensitive dependency tree
        run: npm ls workbox-build @trickfilm400/rollup-plugin-off-main-thread @rollup/plugin-node-resolve minimatch deepmerge --all || true

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build PWA
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Report full development audit
        run: npm audit || true

      - name: Commit verified lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-pwa-security-lock.yml
          git add package-lock.json
          git commit -m "fix: refresh PWA security dependency tree"
          git push origin HEAD:fix/pwa-build-dependency-security
