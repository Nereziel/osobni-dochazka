name: Refresh minimatch lockfile

on:
  push:
    branches:
      - fix/dependabot-minimatch-11
    paths:
      - package.json
      - .github/workflows/refresh-minimatch-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dependabot-minimatch-11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Show resolved minimatch tree
        run: npm ls minimatch --all
      - name: Commit regenerated lock and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-minimatch-lock.yml
          git add package-lock.json
          git commit -m "fix: refresh lockfile for minimatch override"
          git push origin HEAD:fix/dependabot-minimatch-11
