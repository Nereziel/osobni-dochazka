name: Security

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Check tracked sensitive files
        run: node scripts/check-sensitive-files.mjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  database-security:
    name: Database security scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_security_scan
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d attendance_security_scan"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: attendance_security_scan
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Supabase REST roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
          end $$;
          SQL

      - name: Apply base schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schema_base.sql

      - name: Apply security hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_security_hardening.sql

      - name: Apply audit follow-up migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_security_audit_followup.sql

      - name: Apply admin step-up compatibility migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_security_stepup_compat.sql

      - name: Apply admin audit read migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102_admin_audit_read.sql

      - name: Run database security regression suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security.sql
