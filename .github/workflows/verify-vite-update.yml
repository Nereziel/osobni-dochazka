name: Verify Vite update

on:
  push:
    branches:
      - fix/dependabot-minimatch-11
    paths:
      - .github/workflows/verify-vite-update.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dependabot-minimatch-11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Remove one-off verification workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-vite-update.yml
          git commit -m "chore: remove one-off Vite verification workflow"
          git push origin HEAD:fix/dependabot-minimatch-11
