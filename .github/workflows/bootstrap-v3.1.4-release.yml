name: Bootstrap v3.1.4 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-v3.1.4-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Create v3.1.4 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create baseline tag if missing
        run: |
          if ! git rev-parse -q --verify refs/tags/v3.1.3 >/dev/null; then
            git tag v3.1.3 1cebb3d90c854632c5ccff6f009de202cc7d9e23
            git push origin refs/tags/v3.1.3
          fi

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v3.1.4 >/dev/null 2>&1; then
            gh release create v3.1.4 \
              --target c64c73ac720bdb22cf5a5a8ac5e8cf99a22ba02b \
              --title "v3.1.4" \
              --generate-notes
          fi
